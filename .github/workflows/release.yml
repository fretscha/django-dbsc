name: Release

# Publishing happens when a GitHub release is published. It uses PyPI Trusted Publishing (OIDC): no stored token.
on:
  release:
    types: [published]

permissions:
  contents: read

# Actions are pinned to commit SHAs (version in the comment): the publish job can mint the PyPI credential, so a moved
# or compromised tag must not be able to change what runs here.
jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: false # a cache restored from another run must not feed into a release build
      - name: Tag must match package version
        run: |
          version=$(uv version --short)
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - run: uv build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # only this job can mint the OIDC token PyPI trusts
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      # The PyPA action, not `uv publish`: it also signs and uploads PEP 740 attestations (PyPI "provenance"),
      # linking each file to this workflow run. Attestations can only be sent with the upload, never added later.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true
