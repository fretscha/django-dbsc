name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the release workflow runs this first, so nothing is published without a green CI

permissions:
  contents: read

# Actions are pinned to commit SHAs (version in the comment): a moved or compromised tag can't change what runs.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check src
      - name: No missing migrations
        run: uv run python -m django makemigrations --check --dry-run django_dbsc
        env:
          DJANGO_SETTINGS_MODULE: tests.settings
          PYTHONPATH: .

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: pytest with branch coverage (fails below fail_under in pyproject.toml)
        run: uv run --locked pytest -q --cov --cov-report=term

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        django: ["5.2", "6.0", "6.1"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: pytest (Python ${{ matrix.python }}, Django ${{ matrix.django }})
        # Only Django is overridden. pytest and pytest-django come from the locked dev group.
        run: uv run --isolated --locked --python "$PYTHON_VERSION" --with "django~=${DJANGO_VERSION}.0" pytest -q
        env:
          PYTHON_VERSION: ${{ matrix.python }}
          DJANGO_VERSION: ${{ matrix.django }}
