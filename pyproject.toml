[project]
name = "django-dbsc"
version = "0.2.0"
description = "Device Bound Session Credentials (W3C DBSC) for Django: bind session cookies to a device key."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Frederic Tschannen", email = "fretscha@umx.net" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=5.2",
    "http-sf>=1.5",
    "pyjwt[crypto]>=2.10",
]
keywords = ["django", "dbsc", "device-bound-session-credentials", "session", "security", "cookie-theft"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Session",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/fretscha/django-dbsc"
Documentation = "https://github.com/fretscha/django-dbsc/tree/main/docs"
Changelog = "https://github.com/fretscha/django-dbsc/blob/main/CHANGELOG.md"
Issues = "https://github.com/fretscha/django-dbsc/issues"
Specification = "https://w3c.github.io/webappsec-dbsc/"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.3",
    "ty>=0.0.96",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["src/django_dbsc/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DJ", "PT", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107"]
"src/django_dbsc/models.py" = ["RUF012"]  # Django Meta attributes are class-level by design
# Local real-browser harness: urlopen on our own BASE, unverified TLS for the throwaway localhost cert.
"example/scripts/**" = ["S310", "S323"]
"example/demo/settings.py" = ["S105"]

[tool.coverage.run]
source = ["django_dbsc"]
branch = true

[tool.coverage.report]
# CI fails below this. The README badge shows the actual number.
fail_under = 95
show_missing = true
skip_covered = true
